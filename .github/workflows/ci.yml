name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build macOS app
        run: |
          xcodebuild -quiet \
            -project ContactsDeduper.xcodeproj \
            -scheme ContactsDeduper \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run macOS unit tests
        run: |
          xcodebuild test -quiet \
            -project ContactsDeduper.xcodeproj \
            -scheme ContactsDeduper \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS app
        run: |
          xcodebuild -quiet \
            -project ContactsDeduper.xcodeproj \
            -scheme ContactsDeduper \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run iOS Simulator unit tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/ /, "", $2); print $2; exit }')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone Simulator was found."
            xcrun simctl list devices available
            exit 1
          fi

          xcodebuild test -quiet \
            -project ContactsDeduper.xcodeproj \
            -scheme ContactsDeduper \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
